version: '3.8'

services:
  daily-task-manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: daily-task-manager-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/tasks"]
      interval: 30s
      timeout: 10s
      retries: 3
